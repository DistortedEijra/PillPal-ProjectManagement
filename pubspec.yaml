name: myapp4
description: "PillPal: medicine reminder app with PillPalBox, Scan-to-Schedule, missed-dose escalation and caregiver mode."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  intl: ^0.20.2
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.0.0
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  firebase_app_check: ^0.5.0
  firebase_ai: ^5.0.0

  # Notifications & Permissions
  flutter_local_notifications: ^19.5.0
  permission_handler: ^12.0.1
  android_intent_plus: ^6.0.0

  # Other
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1
  cupertino_icons: ^1.0.8
  flutter_bluetooth_serial: ^0.4.0
  shared_preferences: ^2.2.3

  # Scan-to-Schedule (OCR)
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2
  http: ^1.2.2
  collection: ^1.18.0

  # Background missed-dose check while the app is closed
  android_alarm_manager_plus: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
